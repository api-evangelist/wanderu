name: Wanderu
description: Wanderu is a ground-travel metasearch and booking platform - a Kayak-style aggregator
  that lets travelers search, compare, and book intercity bus and train tickets (plus flights and ferries)
  across hundreds of carriers in North America and Europe, including Amtrak, Greyhound, FlixBus, Megabus,
  Peter Pan, VIA Rail, and Deutsche Bahn. Its routing technology stitches together multi-operator
  bus-and-train itineraries, and bookings are completed in-platform with carriers paying a percentage of
  each fare. Wanderu operates a private booking/search API and publishes no public developer program,
  SDKs, or OpenAPI; its public open-source presence is internal engineering tooling on GitHub (the
  redis-backed "bamboo" queuing system). Backed by 500 Global.
